<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Грузинский язык</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <button id="btn-back" class="icon-btn hidden" aria-label="Назад">←</button>
      <h1 id="app-title">Грузинский язык</h1>
    </div>
    <div class="header-right">
      <button id="btn-theme" class="icon-btn" aria-label="Сменить тему">🌓</button>
    </div>
  </header>

  <main class="container">
    <!-- 1. Экран Глав -->
    <section id="screen-chapters" class="screen active">
      <p class="subtitle">Выберите главу для изучения:</p>
      <div id="chapters-list" class="grid-list"></div>
    </section>

    <!-- 2. Экран Уровней -->
    <section id="screen-levels" class="screen">
      <div id="levels-list" class="grid-list"></div>
    </section>

    <!-- 3. Экран действий уровня: Поиск/Список, Карточки, Тест -->
    <section id="screen-level-action" class="screen">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-list">Список / Поиск</button>
        <button class="tab-btn" data-tab="tab-cards">Карточки</button>
        <button class="tab-btn" data-tab="tab-quiz">Тест</button>
      </div>

      <!-- Вкладка: Список и Поиск -->
      <div id="tab-list" class="tab-content active">
        <input type="text" id="search-input" placeholder="Поиск по русски или ქართულად..." class="input-field">
        <div id="phrases-count" class="counter-text"></div>
        <div id="words-list" class="words-container"></div>
      </div>

      <!-- Вкладка: Карточки -->
      <div id="tab-cards" class="tab-content">
        <div class="card-wrapper">
          <div id="flashcard" class="flashcard">
            <div class="card-side card-front">
              <span class="badge">Русский</span>
              <div id="card-ru" class="card-text"></div>
              <small class="card-hint">Нажмите, чтобы перевернуть</small>
            </div>
            <div class="card-side card-back">
              <span class="badge">ქართული</span>
              <div id="card-ka" class="card-text font-geo"></div>
              <div id="card-tr" class="card-subtext"></div>
              <div id="card-ex" class="card-context"></div>
            </div>
          </div>
        </div>
        <div class="card-controls">
          <button id="btn-prev-card" class="btn btn-secondary">← Назад</button>
          <span id="card-counter" class="counter-text">1 / 10</span>
          <button id="btn-next-card" class="btn btn-primary">Вперёд →</button>
        </div>
      </div>

      <!-- Вкладка: Тест -->
      <div id="tab-quiz" class="tab-content">
        <div class="quiz-box">
          <div class="quiz-header">
            <span class="badge">Переведите на грузинский:</span>
            <span id="quiz-counter" class="counter-text">1 / 10</span>
          </div>
          <div id="quiz-ru" class="quiz-prompt"></div>
          
          <form id="quiz-form" onsubmit="return false;">
            <input type="text" id="quiz-input" class="input-field font-geo" placeholder="Введите по-грузински..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div class="quiz-actions">
              <button type="submit" id="btn-check" class="btn btn-primary">Проверить</button>
              <button type="button" id="btn-next-quiz" class="btn btn-secondary hidden">Дальше →</button>
            </div>
          </form>

          <div id="quiz-feedback" class="feedback-box hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
